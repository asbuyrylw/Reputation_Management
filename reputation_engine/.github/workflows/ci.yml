name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REP_TEST_DSN: postgresql://postgres:postgres@localhost:5432/reputation_test
      REP_DB_DSN: postgresql://postgres:postgres@localhost:5432/reputation_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov ruff mypy

      - name: Lint -- real-error rules (BLOCKING)
        run: ruff check --select F,E9 rep_engine/   # undefined names, unused imports, syntax errors

      - name: Lint -- full ruleset (advisory; ratchet toward blocking)
        run: ruff check rep_engine/ || true

      - name: Type check (mypy, advisory until clean)
        run: mypy rep_engine/ --ignore-missing-imports || true

      - name: Run tests with coverage
        # Baseline measured at 57.5% (full suite vs. Postgres). Floor set just below
        # with headroom; ratchet up toward ~70% as the untested hubs get covered.
        run: pytest -q --cov=rep_engine --cov-report=term-missing --cov-fail-under=50
