<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Koob Reply Assist — Settings</title>
<style>
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; width: 340px; padding: 16px; color: #1e293b; }
  h1 { font-size: 15px; margin: 0 0 8px; }
  p { color: #475569; font-size: 12px; }
  label { display: block; margin-top: 12px; font-size: 12px; font-weight: 600; color: #334155; }
  input { width: 100%; box-sizing: border-box; margin-top: 4px; padding: 6px 8px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; }
  button { margin-top: 14px; width: 100%; padding: 8px; border: none; border-radius: 6px; background: #4f46e5; color: #fff; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #status { margin-top: 10px; font-size: 12px; }
  .ok { color: #047857; }
  .err { color: #be123c; }
</style>
</head>
<body>
  <h1>Koob Reply Assist</h1>
  <p>Paste your API base URL and the token generated on the console's Integrations → Reply Assist extension tab.</p>
  <label>API base URL</label>
  <input id="apiBase" placeholder="https://api.yourdomain.com" />
  <label>Token</label>
  <input id="extToken" placeholder="koobext_..." />
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="options.js"></script>
</body>
</html>
