name: CI

# NOTE: this file MUST live at the git-root .github/workflows/ to run on GitHub.
# The project itself lives in the reputation_engine/ subdirectory, so all `run:`
# steps execute there via the job-level working-directory default below.

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: reputation_engine

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: reputation_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      REP_TEST_DSN: postgresql://postgres:postgres@localhost:5432/reputation_test
      REP_DB_DSN: postgresql://postgres:postgres@localhost:5432/reputation_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint -- real-error rules (BLOCKING)
        run: ruff check --select F,E9 rep_engine/   # undefined names, unused imports, syntax errors

      - name: Lint -- full ruleset (advisory; remaining backlog is style only)
        # 86 findings, all stylistic (E702 deliberate one-line CLI parsers, E501 length);
        # no correctness rules. The real-error rules (F, E9) are blocking above. Ratchet:
        # reformat the style backlog, then drop the `|| true`.
        run: ruff check rep_engine/ || true

      - name: Security -- bandit SAST (BLOCKING; medium+ severity)
        # Triaged 2026-06: 3 medium findings resolved (env-driven bind + two parameterized
        # SQL builders annotated # nosec with justification). Now blocks on any new medium+.
        run: bandit -r rep_engine/ -ll

      - name: Type check (mypy, advisory until clean)
        run: mypy rep_engine/ --ignore-missing-imports || true

      - name: Run tests with coverage
        # Baseline measured at 57.5% (full suite vs. Postgres). Floor ratcheted to 55%
        # (just under baseline); keep raising toward ~70% as untested hubs get covered.
        run: pytest --cov=rep_engine --cov-report=term-missing --cov-fail-under=55

      # NOTE: the scoring-judge regression gate moved to its own WEEKLY workflow
      # (.github/workflows/eval-gate.yml) -- it makes ~44 live LLM calls (~8-15 cents
      # of API usage) so it runs on a schedule, not on every push/PR.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so the scan covers every commit
      - name: gitleaks (secret scan; advisory first run, ratchet to blocking)
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7  # v2 (pinned to commit)
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
